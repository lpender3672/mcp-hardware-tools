[project]
name = "hwtools"
version = "0.0.0"
description = "An MCP server that gives Claude direct, self-correcting control of bench instruments."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "penderdesigns" }]
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
    "pyserial>=3.5",
    "mcp>=1.2",
    "scipy>=1.18.0",
]

[project.scripts]
hwtools-server = "hwtools.tools.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwtools"]

# ----------------------------------------------------------------------------
# Quality gates
# ----------------------------------------------------------------------------

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party libs without complete type stubs.
module = ["pyvisa.*", "serial.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "hardware: requires a physical instrument on the bench (excluded from CI; run supervised)",
]

[tool.coverage.run]
source = ["hwtools"]
branch = true
