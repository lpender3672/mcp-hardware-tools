[package]
name = "hwtools-harness-rp2350"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Harness firmware for the RP2350 (Raspberry Pi Pico 2)."

[[bin]]
name = "hwtools-harness-rp2350"
test = false
bench = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embedded-hal = "1.0"
panic-halt = "1.0.0"
rp235x-hal = { version = "0.4.0", features = ["rt", "critical-section-impl"] }
hwtools-harness-common = { path = "../../common" }
usb-device = "0.3.2"
usbd-serial = "0.2.2"
heapless = "0.9.3"
