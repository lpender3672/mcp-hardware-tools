name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type-check (strict)
        run: uv run mypy

      # Hardware-in-the-loop tests are excluded: CI has no bench.
      - name: Test
        run: uv run pytest -m "not hardware"
